name: Caching performance benchmarks

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "sources/Franz.Common.Caching/**"
      - "benchmarks/Franz.Common.Caching.Benchmarks/**"
      - ".github/workflows/caching-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caching-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run caching benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Run Release benchmarks
        run: >-
          dotnet run
          --project benchmarks/Franz.Common.Caching.Benchmarks/Franz.Common.Caching.Benchmarks.csproj
          --configuration Release
          --
          --filter "*CacheProviderBenchmarks*" "*CacheKeyGenerationBenchmarks*"
          --exporters json markdown
          --artifacts ./BenchmarkDotNet.Artifacts

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caching-benchmark-reports
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
