name: Sync develop to Azure DevOps

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: azure-sync-develop
  cancel-in-progress: false

jobs:
  sync-to-azure:
    name: Mirror develop to Azure DevOps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Push develop to Azure DevOps
        env:
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
          AZURE_REPO_USERNAME: ${{ secrets.AZURE_REPO_USERNAME }}
          AZURE_REPO_PAT: ${{ secrets.AZURE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_REPO_URL:-}" || -z "${AZURE_REPO_USERNAME:-}" || -z "${AZURE_REPO_PAT:-}" ]]; then
            echo "::error::Azure DevOps mirror secrets are not fully configured."
            exit 1
          fi

          auth="$(printf '%s' "$AZURE_REPO_USERNAME:$AZURE_REPO_PAT" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push "$AZURE_REPO_URL" HEAD:refs/heads/develop
