name: Dependency and .NET 10 validation

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: dependency-validation-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, audit, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Pull integration-test images
        shell: bash
        run: |
          set -Eeuo pipefail

          pull_image() {
            local image="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "::group::Pulling ${image} (attempt ${attempt}/3)"
              if docker pull "${image}"; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              if (( attempt < 3 )); then
                sleep "$((attempt * 10))"
              fi
            done
            echo "::error::Unable to pull ${image} after three attempts."
            return 1
          }

          pull_image "gvenzl/oracle-free:23-slim-faststart"
          pull_image "mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:9a4f69121f20c1d6502db84625c71ebb441ab61b01880a7b2d3d8031c6dac429"
          pull_image "mongo:7.0"
          pull_image "rabbitmq:4.0-management"
          pull_image "confluentinc/cp-kafka:7.4.0"

          docker image ls --digests

      - name: Restore with NuGet security auditing
        id: restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore Franz.Common.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditLevel=low 2>&1 | tee restore-audit.log
          if grep -E 'NU190[1-4]' restore-audit.log; then
            echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NuGet restore reported vulnerable packages; build and tests will still run for diagnosis."
          else
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build solution
        run: dotnet build Franz.Common.slnx --configuration Release --no-restore

      - name: Verify mediator package includes its source generator
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$(find sources/Franz.Common.Mediator/bin/Release -maxdepth 1 -name 'Franz.Common.Mediator.*.nupkg' -print -quit)"
          test -n "$package"
          package_files="$(unzip -Z1 "$package")"
          grep -Fx 'analyzers/dotnet/cs/Franz.Common.Mediator.SourceGenerator.dll' <<< "$package_files"

          temp_dir="$(mktemp -d)"
          feed="$temp_dir/feed"
          consumer="$temp_dir/consumer"
          mkdir -p "$feed" "$consumer"
          find sources -path '*/bin/Release/*.nupkg' -exec cp -n {} "$feed/" \;

          cat > "$consumer/Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Franz.Common.Mediator" Version="2.3.5" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$consumer/Program.cs" <<'EOF'
          using Franz.Common.Mediator.Dispatchers;
          using Franz.Common.Mediator.Extensions;
          using Franz.Common.Mediator.Handlers;
          using Franz.Common.Mediator.Messages;
          using Microsoft.Extensions.DependencyInjection;

          var services = new ServiceCollection();
          services.AddFranzMediator(new[] { typeof(ConsumerHandler).Assembly });
          using var provider = services.BuildServiceProvider();
          using var scope = provider.CreateScope();
          var dispatcher = scope.ServiceProvider.GetRequiredService<IDispatcher>();
          var response = await dispatcher.SendAsync<string>(new ConsumerCommand("package-generated"));
          return response == "package-generated" ? 0 : 1;

          public sealed record ConsumerCommand(string Value) : ICommand<string>;

          public sealed class ConsumerHandler : ICommandHandler<ConsumerCommand, string>
          {
            public Task<string> Handle(ConsumerCommand command, CancellationToken cancellationToken)
              => Task.FromResult(command.Value);
          }
          EOF

          dotnet restore "$consumer/Consumer.csproj" --source "$feed" --source https://api.nuget.org/v3/index.json
          dotnet run --project "$consumer/Consumer.csproj" --configuration Release --no-restore

      - name: Publish and execute Native AOT mapper smoke test
        run: |
          dotnet publish tests/Franz.Common.AotSmokeTest/Franz.Common.AotSmokeTest.csproj --configuration Release --runtime linux-x64 --self-contained true --no-restore -p:BuildProjectReferences=false -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=full -p:ILLinkTreatWarningsAsErrors=true
          ./tests/Franz.Common.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/Franz.Common.AotSmokeTest

      - name: Test framework architecture policies
        run: dotnet test tests/Franz.Common.Architecture.Tests/Franz.Common.Architecture.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=architecture-tests.trx"

      - name: Test solution
        run: dotnet test Franz.Common.slnx --configuration Release --no-build --blame-hang-timeout 10m --logger "trx;LogFileName=dependency-validation.trx"

      - name: Capture container diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p container-diagnostics
          {
            echo "## Docker version"
            docker version
            echo "## Docker daemon information"
            docker info
            echo "## Docker disk usage"
            docker system df
            echo "## All containers"
            docker ps -a --no-trunc
            echo "## Container inspection"
            container_ids="$(docker ps -aq)"
            if [[ -n "$container_ids" ]]; then
              docker inspect $container_ids
              while IFS= read -r container_id; do
                [[ -z "$container_id" ]] && continue
                echo "## Container logs: $container_id"
                docker logs --timestamps --details "$container_id" 2>&1 || true
              done <<< "$container_ids"
            fi
            echo "## Local image inventory"
            docker image ls --digests --no-trunc
          } > container-diagnostics/docker-diagnostics.log 2>&1 || true

      - name: Enforce vulnerability gate
        if: always() && steps.restore.outputs.vulnerabilities_found == 'true'
        shell: bash
        run: |
          echo "::error::Resolve all NU1901-NU1904 advisories before merging."
          exit 1

      - name: Upload dependency, test, and container reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-validation-reports
          path: |
            restore-audit.log
            **/TestResults/*.trx
            container-diagnostics/**
          if-no-files-found: warn
