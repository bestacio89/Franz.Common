name: Dependency and .NET 10 validation

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: dependency-validation-v7-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.403
  BUILD_CONFIGURATION: Release

jobs:
  quality-gates:
    name: Build, package, AOT, and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public package READMEs
        run: python3 scripts/validate-package-readmes.py

      - name: Validate test-suite ownership
        run: python3 scripts/run-test-suite.py

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore with NuGet security auditing
        id: restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore Franz.Common.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditLevel=low 2>&1 | tee restore-audit.log
          if grep -E 'NU190[1-4]' restore-audit.log; then
            echo "vulnerabilities_found=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NuGet restore reported vulnerable packages; build and tests will still run for diagnosis."
          else
            echo "vulnerabilities_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build solution
        run: dotnet build Franz.Common.slnx --configuration Release --no-restore --maxcpucount:1 -p:BuildInParallel=false -p:GeneratePackageOnBuild=false

      - name: Pack solution for package-consumer validation
        run: dotnet pack Franz.Common.slnx --configuration Release --no-build -p:GeneratePackageOnBuild=false

      - name: Verify mediator package includes its source generator
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$(find sources/Franz.Common.Mediator/bin/Release -maxdepth 1 -name 'Franz.Common.Mediator.*.nupkg' -print -quit)"
          test -n "$package"
          package_files="$(unzip -Z1 "$package")"
          grep -Fx 'analyzers/dotnet/cs/Franz.Common.Mediator.SourceGenerator.dll' <<< "$package_files"

          temp_dir="$(mktemp -d)"
          feed="$temp_dir/feed"
          consumer="$temp_dir/consumer"
          mkdir -p "$feed" "$consumer"
          while IFS= read -r -d '' package_file; do
            cp -n "$package_file" "$feed/"
          done < <(find sources -path '*/bin/Release/*.nupkg' -print0)

          cat > "$consumer/Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Franz.Common.Mediator" Version="3.0.0" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$consumer/Program.cs" <<'EOF'
          using Franz.Common.Mediator.Dispatchers;
          using Franz.Common.Mediator.Extensions;
          using Franz.Common.Mediator.Handlers;
          using Franz.Common.Mediator.Messages;
          using Microsoft.Extensions.DependencyInjection;

          var services = new ServiceCollection();
          services.AddFranzMediator(new[] { typeof(ConsumerHandler).Assembly });
          using var provider = services.BuildServiceProvider();
          using var scope = provider.CreateScope();
          var dispatcher = scope.ServiceProvider.GetRequiredService<IDispatcher>();
          var response = await dispatcher.SendAsync<string>(new ConsumerCommand("package-generated"));
          return response == "package-generated" ? 0 : 1;

          public sealed record ConsumerCommand(string Value) : ICommand<string>;

          public sealed class ConsumerHandler : ICommandHandler<ConsumerCommand, string>
          {
            public Task<string> Handle(ConsumerCommand command, CancellationToken cancellationToken)
              => Task.FromResult(command.Value);
          }
          EOF

          dotnet restore "$consumer/Consumer.csproj" --source "$feed" --source https://api.nuget.org/v3/index.json
          dotnet run --project "$consumer/Consumer.csproj" --configuration Release --no-restore

      - name: Validate gRPC package consumer
        run: bash scripts/validate-grpc-package-consumer.sh

      - name: Publish and execute Native AOT framework and messaging smoke test
        run: |
          dotnet publish tests/Franz.Common.AotSmokeTest/Franz.Common.AotSmokeTest.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=full -p:ILLinkTreatWarningsAsErrors=true
          ./tests/Franz.Common.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/Franz.Common.AotSmokeTest

      - name: Test framework architecture policies
        run: dotnet test tests/Franz.Common.Architecture.Tests/Franz.Common.Architecture.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=architecture-tests.trx"

      - name: Enforce vulnerability gate
        if: always() && steps.restore.outputs.vulnerabilities_found == 'true'
        shell: bash
        run: |
          echo "::error::Resolve all NU1901-NU1904 advisories before merging."
          exit 1

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            restore-audit.log
            **/TestResults/*.trx
            **/CompatibilitySuppressions.xml
          if-no-files-found: warn

  database-tests:
    name: Database providers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Franz.Common.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditLevel=low
      - name: Validate test-suite ownership
        run: python3 scripts/run-test-suite.py
      - name: Run database suite
        run: python3 scripts/run-test-suite.py database --configuration Release --no-restore
      - name: Capture container diagnostics
        if: failure()
        run: bash scripts/capture-container-diagnostics.sh database
      - name: Upload database reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-reports
          path: |
            artifacts/test-results/**
            **/TestResults/*.trx
            container-diagnostics/**
          if-no-files-found: warn

  messaging-tests:
    name: Messaging transports and Sagas
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Franz.Common.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditLevel=low
      - name: Validate test-suite ownership
        run: python3 scripts/run-test-suite.py
      - name: Run messaging suite
        run: python3 scripts/run-test-suite.py messaging --configuration Release --no-restore
      - name: Capture container diagnostics
        if: failure()
        run: bash scripts/capture-container-diagnostics.sh messaging
      - name: Upload messaging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messaging-test-reports
          path: |
            artifacts/test-results/**
            **/TestResults/*.trx
            container-diagnostics/**
          if-no-files-found: warn

  core-tests:
    name: Core framework
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Franz.Common.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditLevel=low
      - name: Validate test-suite ownership
        run: python3 scripts/run-test-suite.py
      - name: Run core suite
        run: python3 scripts/run-test-suite.py core --configuration Release --no-restore
      - name: Upload core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            artifacts/test-results/**
            **/TestResults/*.trx
          if-no-files-found: warn

  integration-tests:
    name: Cross-cutting integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore Franz.Common.slnx --force-evaluate -p:NuGetAudit=true -p:NuGetAuditLevel=low
      - name: Validate test-suite ownership
        run: python3 scripts/run-test-suite.py
      - name: Run integration suite
        run: python3 scripts/run-test-suite.py integration --configuration Release --no-restore
      - name: Capture container diagnostics
        if: failure()
        run: bash scripts/capture-container-diagnostics.sh integration
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            artifacts/test-results/**
            **/TestResults/*.trx
            container-diagnostics/**
          if-no-files-found: warn
