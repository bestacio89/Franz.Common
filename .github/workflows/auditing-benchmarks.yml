name: Entity auditing dispatch benchmarks

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "sources/Franz.Common.EntityFramework/DbContextBase.cs"
      - "sources/Franz.Common.Business/Domain/**"
      - "benchmarks/Franz.Common.EntityFramework.Auditing.Benchmarks/**"
      - ".github/workflows/auditing-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditing-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Compare legacy and direct audit dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Run Release benchmarks
        run: >-
          dotnet run
          --project benchmarks/Franz.Common.EntityFramework.Auditing.Benchmarks/Franz.Common.EntityFramework.Auditing.Benchmarks.csproj
          --configuration Release
          --
          --filter "*AuditDispatchBenchmarks*"
          --exporters json markdown
          --artifacts ./BenchmarkDotNet.Artifacts

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditing-dispatch-benchmarks
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: error
