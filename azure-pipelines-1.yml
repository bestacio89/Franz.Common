trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-24.04'

variables:
- group: 'Secrets and variables'
- name: buildConfiguration
  value: 'Release'
- name: outputDir
  value: '$(Build.ArtifactStagingDirectory)/packages'
- name: azureOrg
  value: 'EntelekheiaSystems'
- name: feedName
  value: 'AjnaTellus'

stages:

# ============================================================
# BUILD — single restore + build, publish binaries as artifact
# ============================================================
- stage: Build
  displayName: Build

  jobs:
  - job: build
    displayName: Build Solution

    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'

    - task: NuGetAuthenticate@1

    - script: |
        set -euo pipefail
        dotnet restore
      displayName: Restore

    - script: |
        set -euo pipefail
        dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

    - publish: $(System.DefaultWorkingDirectory)
      artifact: built-sources
      displayName: Publish built sources


# ============================================================
# TESTS — all jobs download the same artifact, run in parallel
# ============================================================
- stage: Tests
  displayName: Tests
  dependsOn: Build

  jobs:
  - job: framework_architecture_tests
    displayName: Framework Architecture Tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/Franz.Common.Architecture.Tests/Franz.Common.Architecture.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Run Framework Architecture Tests


  # ---------------- CORE ----------------
  - job: unit_tests
    displayName: Unit Tests (Fast Gate)
    steps:
    - download: current
      artifact: built-sources
      displayName: Download built sources

    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'

    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Business.Tests.csproj \
          --configuration $(buildConfiguration) \
          --no-build \
          --logger trx
      displayName: Run Unit Tests

  # ---------------- PARALLEL BATCH ----------------
  - job: Mediator_Tests
    displayName: Mediator Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packagetype: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Mediator.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Mediator Tests 


  - job: cache_tests
    displayName: Cache Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Caching.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Cache Tests

  - job: mapping_tests
    displayName: Mapping Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Mapping.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Mapping Tests

  - job: messaging_core
    displayName: Messaging Core Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Messaging.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Messaging Core Tests

  - job: kafka_tests
    displayName: Kafka Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Messaging.Kafka.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Kafka Tests

  - job: rabbitmq_tests
    displayName: RabbitMQ Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Messaging.RabbitMQ.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: RabbitMQ Tests

  - job: kafka_hosting_tests
    displayName: Kafka Hosting Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Messaging.Hosting.Kafka.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Kafka Hosting Tests

  - job: rabbitmq_hosting_tests
    displayName: RabbitMQ Hosting Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.Messaging.Hosting.RabbitMQ.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: RabbitMQ Hosting Tests

  - job: ef_sqlserver
    displayName: SQLServer Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.EntityFramework.SQLServer.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: SQLServer Tests

  - job: ef_postgres
    displayName: Postgres Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.EntityFramework.Postgres.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Postgres Tests

  - job: ef_oracle
    displayName: Oracle Tests
    dependsOn: unit_tests
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.EntityFramework.Oracle.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx
      displayName: Oracle Tests

  - job: cosmos_tests
    displayName: Cosmos Tests
    dependsOn: unit_tests
    timeoutInMinutes: 30
    steps:
    - download: current
      artifact: built-sources
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '10.0.400'
    - script: |
        set -euo pipefail
        dotnet test $(Pipeline.Workspace)/built-sources/tests/*/Franz.Common.AzureCosmosDB.Tests.csproj \
          --configuration $(buildConfiguration) --no-build --logger trx \
          --blame-hang-timeout 10m
      displayName: Cosmos Tests


# ============================================================
# PACKAGE — PowerShell@2 invokes .ps1 correctly on Linux runners
# ============================================================
- stage: Package
  displayName: Package
  dependsOn: Tests
  condition: succeeded()

  jobs:
  - deployment: pack
    displayName: Pack and Publish
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          # Fresh checkout — reliable source of truth for publishing.
          # Artifacts don't guarantee complete capture; repo checkout does.
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: '10.0.400'

          - task: NuGetAuthenticate@1

          - script: |
              set -euo pipefail
              dotnet restore
            displayName: Restore

          - script: |
              set -euo pipefail
              dotnet build --configuration $(buildConfiguration) --no-restore
            displayName: Build

          - task: PowerShell@2
            displayName: Clean package staging directory
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $packageDirectory = '$(outputDir)'
                if (Test-Path $packageDirectory) {
                  Remove-Item -Path $packageDirectory -Recurse -Force
                }
                New-Item -Path $packageDirectory -ItemType Directory -Force | Out-Null

          - script: |
              set -euo pipefail
              dotnet pack           --configuration $(buildConfiguration)           --no-restore           --no-build           --output $(outputDir)
            displayName: Pack NuGet

          - task: PowerShell@2
            displayName: Validate package release metadata
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                $expectedVersion = '2.3.1'
                $packages = @(Get-ChildItem -Path '$(outputDir)' -Filter '*.nupkg' -File)
                if ($packages.Count -eq 0) {
                  throw "No NuGet packages were produced in $(outputDir)."
                }

                Add-Type -AssemblyName System.IO.Compression.FileSystem
                foreach ($package in $packages) {
                  $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
                  try {
                    $nuspec = $archive.Entries | Where-Object { $_.FullName -match '\\.nuspec
          # Scripts are at repo root, resolved from the checkout workspace.

          - task: PowerShell@2
            displayName: Publish to Franz Artifact
            inputs:
                filePath: '$(System.DefaultWorkingDirectory)/FranzArtifactPublisher.ps1'
                arguments: '-PackagesDirectory "$(outputDir)"'
                pwsh: true
          
          - task: PowerShell@2
            displayName: Publish to NuGet.org
            inputs:
              filePath: '$(System.DefaultWorkingDirectory)/nugetpublish.ps1'
              arguments: '-PackagesDirectory "$(outputDir)"'
              pwsh: true
            env:
              NUGET_API_KEY: $(API_Key)


# ============================================================
# SYNC
# ============================================================
- stage: Sync
  displayName: Sync Repos
  dependsOn: Package
  condition: succeeded()

  jobs:
  - job: github_sync
    displayName: Sync to GitHub

    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - script: |
        set -euo pipefail
        git remote add github "https://$(GITHUB_USER):$(GITHUB_TOKEN)@github.com/bestacio89/Franz.Common.git" || true
        git push --force github origin/main:refs/heads/main
        git push --force github origin/Develop:refs/heads/develop
      displayName: Sync main and develop } | Select-Object -First 1
              if ($null -eq $nuspec) {
                throw "Package '$($package.Name)' has no nuspec metadata."
              }

              $reader = [System.IO.StreamReader]::new($nuspec.Open())
              try { [xml]$metadata = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $actualVersion = [string]$metadata.package.metadata.version
              if ($actualVersion -ne $expectedVersion) {
                throw "Package '$($package.Name)' has version '$actualVersion'; expected '$expectedVersion'."
              }
            } finally {
              $archive.Dispose()
            }
          }

          Write-Host "Validated $($packages.Count) package(s) at version $expectedVersion."

    # PowerShell@2 uses pwsh on Linux — correct runtime for .ps1 files.
    # Scripts are at repo root, resolved from the checkout workspace.

    - task: PowerShell@2
      displayName: Publish to Franz Artifact
      inputs:
          filePath: '$(System.DefaultWorkingDirectory)/FranzArtifactPublisher.ps1'
          arguments: '-PackagesDirectory "$(outputDir)"'
          pwsh: true
    
    - task: PowerShell@2
      displayName: Publish to NuGet.org
      inputs:
        filePath: '$(System.DefaultWorkingDirectory)/nugetpublish.ps1'
        arguments: '-PackagesDirectory "$(outputDir)"'
        pwsh: true
      env:
        NUGET_API_KEY: $(API_Key)


# ============================================================
# SYNC
# ============================================================
- stage: Sync
  displayName: Sync Repos
  dependsOn: Package
  condition: succeeded()

  jobs:
  - job: github_sync
    displayName: Sync to GitHub

    steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - script: |
        set -euo pipefail
        git remote add github "https://$(GITHUB_USER):$(GITHUB_TOKEN)@github.com/bestacio89/Franz.Common.git" || true
        git push --force github origin/main:refs/heads/main
        git push --force github origin/Develop:refs/heads/develop
      displayName: Sync main and develop